family = "c-build"
tags = ["c", "make", "build", "linker"]
[limits]
max_steps = 15
[[check]]
name = "builds_and_runs"
type = "output_equals"
run = "make -s clean >/dev/null; make -s >/dev/null && ./geometry"
expected = "hypot(3,4) = 5.00"
[[check]]
name = "source_untouched"
type = "unchanged"
paths = ["geometry.c"]
