family = "c-bugfix"
tags = ["c", "bugfix", "edit"]
[limits]
max_steps = 15
[[check]]
name = "hidden_tests"
type = "command"
run = "gcc -Wall -Wextra -Werror -DNO_MAIN count.c $CHECKS/test_count.c -o $TMPDIR/t && $TMPDIR/t"
[[check]]
name = "scope"
type = "only_changed"
paths = ["count.c"]
required = false
