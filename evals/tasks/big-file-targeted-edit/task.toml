family = "c-bugfix"
tags = ["c", "bugfix", "large-file", "navigation"]
[limits]
max_steps = 20
[[check]]
name = "hidden_tests"
type = "command"
run = "gcc -Wall -Werror -c table.c -o $TMPDIR/table.o && gcc $CHECKS/test_table.c $TMPDIR/table.o -o $TMPDIR/t && $TMPDIR/t"
[[check]]
name = "scope"
type = "only_changed"
paths = ["table.c"]
